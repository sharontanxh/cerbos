syntax = "proto3";

package cerbos.audit.v1;

import "buf/validate/validate.proto";
import "cerbos/engine/v1/engine.proto";
import "cerbos/policy/v1/policy.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option csharp_namespace = "Cerbos.Api.V1.Audit";
option go_package = "github.com/cerbos/cerbos/api/genpb/cerbos/audit/v1;auditv1";
option java_package = "dev.cerbos.api.v1.audit";

message AccessLogEntry {
  string call_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  Peer peer = 3;
  map<string, MetaValues> metadata = 4;
  string method = 5;
  uint32 status_code = 6;
  bool oversized = 7;
  PolicySource policy_source = 8;
  optional RequestContext request_context = 9;
}

message DecisionLogEntry {
  message CheckResources {
    repeated cerbos.engine.v1.CheckInput inputs = 1;
    repeated cerbos.engine.v1.CheckOutput outputs = 2;
    string error = 3;
  }

  message PlanResources {
    cerbos.engine.v1.PlanResourcesInput input = 1;
    cerbos.engine.v1.PlanResourcesOutput output = 2;
    string error = 3;
  }

  string call_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  Peer peer = 3;
  // Deprecated. Use method.check_resources.inputs instead.
  repeated cerbos.engine.v1.CheckInput inputs = 4 [deprecated = true];
  // Deprecated. Use method.check_resources.outputs instead.
  repeated cerbos.engine.v1.CheckOutput outputs = 5 [deprecated = true];
  // Deprecated. Use method.check_resources.error instead.
  string error = 6 [deprecated = true];
  oneof method {
    CheckResources check_resources = 7;
    PlanResources plan_resources = 8;
  }
  map<string, MetaValues> metadata = 15;
  AuditTrail audit_trail = 16;
  bool oversized = 17;
  PolicySource policy_source = 18;
  optional RequestContext request_context = 19;
}

message MetaValues {
  repeated string values = 1;
}

message Peer {
  string address = 1;
  string auth_info = 2;
  string user_agent = 3;
  string forwarded_for = 4;
}

message AuditTrail {
  map<string, cerbos.policy.v1.SourceAttributes> effective_policies = 1;
  repeated PlanContribution plan_contributions = 2;
}

// PlanContribution records a single binding's contribution to a per-action
// filter produced by Plan. See internal/ruletable/plan.go for the elision and
// inversion semantics that determine which bindings survive and how they are
// tagged.
//
// Ordering: PlanContributions in an AuditTrail MUST be sorted by
// (action ASC, policy_fqn ASC, scope ASC, role ASC).
message PlanContribution {
  // Kind enum values are assigned in precedence order. When more than one
  // Kind could apply to a single contribution (e.g. a child OVERRIDE_PARENT
  // scope produces an unconditional ALLOW that both survives as DIRECT_ALLOW
  // AND suppresses parent-scope walks as OVERRIDE_PARENT_ALLOW_SOURCE), the
  // contribution MUST be tagged with the Kind that has the highest numeric
  // value. Do NOT renumber or insert intermediate values without updating
  // the precedence semantics described in this comment and in
  // internal/ruletable/plan.go.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_DIRECT_ALLOW = 1;
    KIND_DIRECT_DENY = 2;
    KIND_INVERTED_DENY_AS_GATE = 3;
    KIND_ROLE_POLICY_DENY_AND_GATE = 4;
    KIND_SCHEMA_REJECTION = 5;
    KIND_OVERRIDE_PARENT_ALLOW_SOURCE = 6;
  }

  // The concrete action that was requested (not a binding-level wildcard).
  // Empty for KIND_SCHEMA_REJECTION, which short-circuits before any
  // per-action evaluation.
  string action = 1;
  // Fully-qualified name of the policy whose binding contributed.
  string policy_fqn = 2;
  // Scope at which the contributing binding was matched. Empty for the root
  // scope and for KIND_SCHEMA_REJECTION.
  string scope = 3;
  // Role from the principal's role set that matched the contributing binding.
  // Empty for principal-policy contributions (which are role-agnostic) and for
  // KIND_SCHEMA_REJECTION.
  string role = 4;
  Kind kind = 5;
}

message PolicySource {
  message Blob {
    string bucket_url = 1;
    string prefix = 2;
  }

  message Database {
    enum Driver {
      DRIVER_UNSPECIFIED = 0;
      DRIVER_MYSQL = 1;
      DRIVER_POSTGRES = 2;
      DRIVER_SQLITE3 = 3;
    }

    Driver driver = 1;
  }

  message Disk {
    string directory = 1;
  }

  message EmbeddedPDP {
    string url = 1;
    string commit_hash = 2;
    google.protobuf.Timestamp built_at = 3;
  }

  message Git {
    string repository_url = 1;
    string branch = 2;
    string subdirectory = 3;
    string hash = 4;
  }

  message Hub {
    message EmbeddedBundle {
      string rule_id = 1;
      repeated string scopes = 2;
      string bundle_id = 3;
    }

    message LocalBundle {
      string path = 1;
      string bundle_id = 2;
    }

    message RemoteBundle {
      string deployment_id = 1;
      string bundle_id = 2;
    }

    oneof source {
      string label = 1;
      string deployment_id = 2 [deprecated = true];
      string playground_id = 3;
      LocalBundle local_bundle = 4;
      EmbeddedBundle embedded_bundle = 5;
      RemoteBundle remote_bundle = 6;
    }
  }

  oneof source {
    Blob blob = 1;
    Database database = 2;
    Disk disk = 3;
    Git git = 4;
    Hub hub = 5;
    EmbeddedPDP embedded_pdp = 6;
  }
}

message RequestContext {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {description: "Optional metadata to attach to the request. This information will be captured in the audit logs if audit logging is enabled."}
  };
  map<string, google.protobuf.Value> annotations = 1 [
    (buf.validate.field).map.keys = {
      string: {min_len: 1}
    },
    (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
      description: "Key-value pairs of annotations."
      min_properties: 1
      example: "{\"app-name\": \"awesome-app\", \"app-version\": \"1.2.3\"}"
    }
  ];
}
